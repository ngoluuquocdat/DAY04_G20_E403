# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: ask_user_for_info
    description: "Dùng để đặt câu hỏi cho người dùng khi thiếu thông tin quan trọng (ví dụ: tên tài khoản, URL) hoặc để xin phép xác nhận trước khi thực hiện hành động gửi. Tuyệt đối không tự ý đoán thông tin."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: get_user_recent_tweets
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter. BẮT BUỘC PHẢI CÓ tên tài khoản (handle) cụ thể. Nếu user không cung cấp handle, KHÔNG DÙNG tool này mà dùng ask_user_for_info để hỏi."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: search_twitter_by_keyword
    description: "Tìm kiếm các bài đăng trên mạng xã hội Twitter theo chủ đề hoặc từ khóa. QUAN TRỌNG: Nếu trong lịch sử chat người dùng đã yêu cầu 'bỏ Twitter' hoặc 'chuyển sang web', TUYỆT ĐỐI KHÔNG gọi tool này nữa."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: search_web_information
    description: "Tra cứu thông tin, tin tức trên mạng Internet. (Lưu ý: Không bao gồm các từ dư thừa như 'tin tức', 'news' trong từ khóa tìm kiếm nếu topic đã là news)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cốt lõi (Tuyệt đối không kèm các từ dư thừa như 'tin tức', 'news' nếu topic đã là news)"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: read_webpage_content
    description: "Lấy toàn bộ nội dung từ một trang web. BẮT BUỘC PHẢI CÓ đường dẫn (URL) cụ thể. Nếu user không cung cấp URL, dùng ask_user_for_info để hỏi."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format_data_to_markdown
    description: "Định dạng và trình bày lại dữ liệu thô thành văn bản markdown dễ đọc."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send_telegram_message
    description: "Gửi một tin nhắn hoặc báo cáo lên Telegram. BẮT BUỘC PHẢI DÙNG ask_user_for_info (với response_type=yes_no) ĐỂ XIN PHÉP NGƯỜI DÙNG TRƯỚC KHI GỌI TOOL NÀY."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: search_internal_policy
    description: "Tìm kiếm các tài liệu, quy định nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: search_arxiv_papers
    description: "Tìm kiếm các bài báo khoa học trên ArXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: read_arxiv_paper_content
    description: "Lấy toàn bộ nội dung text của một bài báo khoa học trên ArXiv bằng URL hoặc ID."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: get_exchange_rate
    description: "Tra cứu tỷ giá ngoại tệ hiện tại."
    parameters:
      type: object
      properties:
        base: {type: string, default: "USD", description: "Loại tiền gốc"}
        target: {type: string, default: "VND", description: "Loại tiền đích"}
      required: [base, target]
